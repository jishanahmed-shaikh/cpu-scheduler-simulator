# Production-style run:  docker compose up --build   -> http://localhost:8080
# Hot-reload dev run:    docker compose --profile dev up --build  -> http://localhost:5173
services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
    command: npm run dev -- --host 0.0.0.0
